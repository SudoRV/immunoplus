<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Gallery Component</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #011425; /* Dark underwater base */
        background-image: radial-gradient(circle at center, #022b4d 0%, #011425 100%);
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
    }

    .gallery-container {
        position: relative;
        width: 800px;
        height: 550px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Glowing Cylinder Effect */
    .cylinder-wrapper {
        position: absolute;
        top: 20px;
        width: 700px;
        height: 420px;
        pointer-events: none;
    }

    .cylinder-ring-top, .cylinder-ring-bottom {
        position: absolute;
        width: 100%;
        height: 120px;
        border: 2px solid rgba(0, 240, 255, 0.4);
        border-radius: 50%;
        box-shadow: 
            0 0 20px rgba(0, 240, 255, 0.2), 
            inset 0 0 20px rgba(0, 240, 255, 0.2);
    }

    .cylinder-ring-top { top: -60px; }
    .cylinder-ring-bottom { bottom: -60px; }

    .cylinder-side-left, .cylinder-side-right {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(to bottom, rgba(0, 240, 255, 0.1), rgba(0, 240, 255, 0.6), rgba(0, 240, 255, 0.1));
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .cylinder-side-left { left: 0; }
    .cylinder-side-right { right: 0; }

    /* 3D Carousel Setup */
    .carousel-perspective {
        position: relative;
        width: 100%;
        height: 450px;
        perspective: 1500px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .carousel-track {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
    }

    .card {
        position: absolute;
        left: 50%;
        top: 50%;
        background-color: #1a1a1a;
        background-size: cover;
        background-position: center;
        border-radius: 8px;
        border: 1px solid rgba(0, 240, 255, 0.3);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        text-align: center;
        padding: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        transition: transform 0.4s ease;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
        z-index: 1;
    }

    .card-content {
        position: relative;
        z-index: 2;
    }

    .card-title { font-weight: 700; margin-bottom: 4px; }
    .card-subtitle { font-weight: 300; font-size: 0.85rem; color: #ccc; }

    /* Specific Card Positions & Sizes */
    .card-center {
        width: 240px;
        height: 380px;
        transform: translate(-50%, -50%) translateZ(120px);
        z-index: 5;
        border: 2px solid rgba(0, 240, 255, 0.7);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        background-image: url('https://images.unsplash.com/photo-1584362917165-526a968579e8?w=400&q=80'); /* Placeholder for Ionizer */
    }
    .card-center .card-title { font-size: 1.2rem; }

    .card-left-1 {
        width: 180px;
        height: 320px;
        transform: translate(-50%, -50%) translateX(-150px) translateZ(0px) rotateY(20deg);
        z-index: 4;
        background-image: url('https://images.unsplash.com/photo-1541140532154-b024d705b909?w=400&q=80');
    }

    .card-left-2 {
        width: 140px;
        height: 280px;
        transform: translate(-50%, -50%) translateX(-270px) translateZ(-120px) rotateY(35deg);
        z-index: 3;
        opacity: 0.8;
        background-image: url('https://images.unsplash.com/photo-1548839140-29a749e1bc4e?w=400&q=80');
    }

    .card-right-1 {
        width: 180px;
        height: 320px;
        transform: translate(-50%, -50%) translateX(150px) translateZ(0px) rotateY(-20deg);
        z-index: 4;
        background-image: url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=400&q=80');
    }

    .card-right-2 {
        width: 140px;
        height: 280px;
        transform: translate(-50%, -50%) translateX(270px) translateZ(-120px) rotateY(-35deg);
        z-index: 3;
        opacity: 0.8;
        background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=80');
    }

    /* Controls (Arrows and Dots) */
    .controls {
        position: relative;
        width: 600px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }

    .arrow-svg {
        width: 80px;
        height: 30px;
        stroke: rgba(255, 255, 255, 0.6);
        fill: none;
        stroke-width: 2;
    }

    .dots {
        display: flex;
        gap: 12px;
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
    }

    .dot.active {
        background-color: #00f0ff;
        box-shadow: 0 0 10px #00f0ff;
        transform: scale(1.2);
    }
</style>
</head>
<body>

<div class="gallery-container">
    <!-- Glowing Cylinder -->
    <div class="cylinder-wrapper">
        <div class="cylinder-ring-top"></div>
        <div class="cylinder-side-left"></div>
        <div class="cylinder-side-right"></div>
        <div class="cylinder-ring-bottom"></div>
    </div>

    <!-- Cards -->
    <div class="carousel-perspective">
        <div class="carousel-track">
            
            <div class="card card-left-2">
                <div class="card-content">
                    <div class="card-title">Pure</div>
                    <div class="card-subtitle">Quality</div>
                </div>
            </div>

            <div class="card card-left-1">
                <div class="card-content">
                    <div class="card-title">Healthier</div>
                    <div class="card-subtitle">Lives</div>
                </div>
            </div>

            <div class="card card-center">
                <div class="card-content">
                    <div class="card-title">Premium Technology</div>
                    <div class="card-subtitle">for a Healthier Tomorrow</div>
                </div>
            </div>

            <div class="card card-right-1">
                <div class="card-content">
                    <div class="card-title">For Homes</div>
                    <div class="card-subtitle">& Businesses</div>
                </div>
            </div>

            <div class="card card-right-2">
                <div class="card-content">
                    <div class="card-title">A Cleaner</div>
                    <div class="card-subtitle">Greener Future</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
        <svg class="arrow-svg" viewBox="0 0 100 30" style="transform: scaleX(-1);">
            <path d="M10,15 Q50,30 90,15" />
            <polygon points="10,15 20,10 18,20" fill="rgba(255,255,255,0.6)" stroke="none" />
        </svg>
        
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <svg class="arrow-svg" viewBox="0 0 100 30">
            <path d="M10,15 Q50,30 90,15" />
            <polygon points="90,15 80,10 82,20" fill="rgba(255,255,255,0.6)" stroke="none" />
        </svg>
    </div>
</div>

</body>
</html>
